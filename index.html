<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvoicePilot AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf3; --panel:#ffffff; --ink:#0f1e33; --muted:#5d6b80; --line:#d5dce6;
  --accent:#1f4fe0; --accent-ink:#ffffff; --field:#f5f7fa; --danger:#c0392b;
  --head:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Hanken Grotesk","Segoe UI",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c121c; --panel:#151e2c; --ink:#e8edf5; --muted:#93a1b6; --line:#27344a;
    --accent:#6b8cff; --accent-ink:#0c121c; --field:#1b2638; --danger:#ff8a7a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c121c; --panel:#151e2c; --ink:#e8edf5; --muted:#93a1b6; --line:#27344a;
  --accent:#6b8cff; --accent-ink:#0c121c; --field:#1b2638; --danger:#ff8a7a; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
header.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--head);letter-spacing:-.02em;margin-right:auto}
.brand span{color:var(--accent)}
button{font:600 14px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:24px;padding:24px;max-width:1280px;margin:0 auto;align-items:start}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.editor h2{font:700 16px var(--head);margin:22px 0 10px}
.editor h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:64px}
.item{display:grid;grid-template-columns:1fr 64px 90px 32px;gap:8px;align-items:end;margin-bottom:8px}
.item label{margin:0}
.item .x{padding:9px 0;color:var(--danger)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.chips{display:flex;gap:6px;margin:-4px 0 10px;flex-wrap:wrap}
.chips button{padding:4px 10px;font-size:12px}
.preview-wrap{overflow-x:auto}
.paper{background:#fff;color:#14213d;border-radius:6px;padding:48px;min-height:720px;max-width:820px;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:14px;min-width:560px}
.paper h1{font:700 40px/1 var(--head);letter-spacing:-.03em;margin:0}
.p-top{display:flex;justify-content:space-between;gap:24px;border-bottom:3px solid #1f4fe0;padding-bottom:20px}
.p-meta{text-align:right;line-height:1.7}
.p-meta b{display:inline-block;min-width:76px;color:#5d6b80;font-weight:500;text-align:right}
.p-parties{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:26px 0}
.p-parties small{display:block;color:#5d6b80;margin-bottom:4px}
.p-parties strong{font-size:16px}
.pre{white-space:pre-line}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:left;font-weight:600;color:#5d6b80;padding:8px 0;border-bottom:1px solid #d5dce6}
td{padding:11px 0;border-bottom:1px solid #e8edf3;vertical-align:top}
th:not(:first-child),td:not(:first-child){text-align:right;white-space:nowrap;padding-left:14px}
.totals{margin:18px 0 0 auto;width:min(300px,100%)}
.totals div{display:flex;justify-content:space-between;padding:5px 0}
.totals .due{border-top:2px solid #14213d;margin-top:8px;padding-top:10px;font:700 22px var(--head)}
.notes{margin-top:34px;color:#5d6b80}
.notes b{display:block;color:#14213d}
.empty{color:#93a1b6;font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:900px){.layout{grid-template-columns:1fr;padding:14px}.paper{padding:28px}}
@media print{
  @page{margin:12mm}
  body{background:#fff}
  header.bar,.editor,.toast{display:none!important}
  :root{padding:0}
  .layout{display:block;padding:0;max-width:none}
  .preview-wrap{overflow:visible}
  .paper{box-shadow:none;padding:0;max-width:none;min-width:0}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Invoice<span>Pilot</span> AI</div>
  <button id="new">New invoice</button>
  <button id="theme" aria-label="Toggle dark mode">Theme</button>
  <button id="print" class="primary">Print or save as PDF</button>
</header>

<main class="layout">
  <section class="editor" aria-label="Invoice details">
    <h2>Your business</h2>
    <label>Business name<input data-k="from" placeholder="Northwind Studio"></label>
    <label>Address and contact<textarea data-k="fromAddr" placeholder="12 Lake Road&#10;hello@northwind.studio"></textarea></label>

    <h2>Client</h2>
    <label>Client name<input data-k="to" placeholder="Acme Corp"></label>
    <label>Client address<textarea data-k="toAddr" placeholder="500 Market Street"></textarea></label>

    <h2>Invoice</h2>
    <div class="row">
      <label>Invoice number<input data-k="num"></label>
      <label>Currency
        <select data-k="cur">
          <option value="USD">USD ($)</option><option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option><option value="INR">INR (₹)</option>
          <option value="AUD">AUD (A$)</option><option value="CAD">CAD (C$)</option>
        </select>
      </label>
      <label>Issue date<input type="date" data-k="issue"></label>
      <label>Due date<input type="date" data-k="due"></label>
    </div>
    <div class="chips" aria-label="Payment terms">
      <button data-net="0">Due on receipt</button><button data-net="15">Net 15</button><button data-net="30">Net 30</button><button data-net="60">Net 60</button>
    </div>

    <h2>Line items</h2>
    <div id="items"></div>
    <button id="add">Add line item</button>

    <h2>Adjustments</h2>
    <div class="row">
      <label>Tax rate (%)<input type="number" min="0" step="0.01" data-k="tax"></label>
      <label>Discount (%)<input type="number" min="0" max="100" step="0.01" data-k="disc"></label>
    </div>
    <label>Notes or payment details<textarea data-k="notes" placeholder="Bank transfer to… Thank you for your business."></textarea></label>
    <p class="hint">Changes save automatically in this browser.</p>
  </section>

  <section class="preview-wrap" aria-label="Invoice preview">
    <article class="paper" id="paper"></article>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY="invoicepilot-ai:v1";
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  function iso(d){return d.toISOString().slice(0,10)}
  function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function blank(n){
    var t=iso(new Date());
    return {from:"",fromAddr:"",to:"",toAddr:"",num:"INV-"+String(n||1).padStart(4,"0"),cur:"USD",
      issue:t,due:addDays(t,30),tax:0,disc:0,notes:"",items:[{d:"",q:1,r:0}],counter:n||1};
  }
  var S;
  try{ S=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ S=null; }
  if(!S||!S.items) S=blank(1);

  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},1800)}

  function money(n){
    try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur}).format(n); }
    catch(e){ return n.toFixed(2); }
  }
  function fdate(s){
    if(!s) return "—";
    return new Date(s+"T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  }
  function calc(){
    var sub=S.items.reduce(function(a,i){return a+(+i.q||0)*(+i.r||0)},0);
    var disc=sub*(+S.disc||0)/100;
    var taxable=sub-disc;
    var tax=taxable*(+S.tax||0)/100;
    return {sub:sub,disc:disc,tax:tax,total:taxable+tax};
  }

  function renderItems(){
    var box=$("#items");
    box.innerHTML="";
    S.items.forEach(function(it,i){
      var row=document.createElement("div");
      row.className="item";
      row.innerHTML=
        '<label>Description<input data-i="'+i+'" data-f="d" value="'+esc(it.d)+'"></label>'+
        '<label>Qty<input type="number" min="0" step="any" data-i="'+i+'" data-f="q" value="'+esc(it.q)+'"></label>'+
        '<label>Rate<input type="number" min="0" step="any" data-i="'+i+'" data-f="r" value="'+esc(it.r)+'"></label>'+
        '<button class="x" data-del="'+i+'" aria-label="Remove line item">✕</button>';
      box.appendChild(row);
    });
  }

  function renderPaper(){
    var c=calc();
    var rows=S.items.filter(function(i){return i.d||+i.r}).map(function(i){
      var q=+i.q||0,r=+i.r||0;
      return "<tr><td>"+esc(i.d||"Item")+"</td><td>"+q+"</td><td>"+money(r)+"</td><td>"+money(q*r)+"</td></tr>";
    }).join("");
    var h=
      '<div class="p-top"><div><h1>Invoice</h1></div><div class="p-meta">'+
      '<div><b>Number</b> '+esc(S.num||"—")+'</div>'+
      '<div><b>Issued</b> '+fdate(S.issue)+'</div>'+
      '<div><b>Due</b> '+fdate(S.due)+'</div></div></div>'+
      '<div class="p-parties"><div><small>From</small><strong>'+(esc(S.from)||'<span class="empty">Your business</span>')+'</strong><div class="pre">'+esc(S.fromAddr)+'</div></div>'+
      '<div><small>Billed to</small><strong>'+(esc(S.to)||'<span class="empty">Client name</span>')+'</strong><div class="pre">'+esc(S.toAddr)+'</div></div></div>'+
      '<table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan="4" class="empty">Add a line item to see it here.</td></tr>')+'</tbody></table>'+
      '<div class="totals"><div><span>Subtotal</span><span>'+money(c.sub)+'</span></div>'+
      (+S.disc?'<div><span>Discount ('+(+S.disc)+'%)</span><span>−'+money(c.disc)+'</span></div>':'')+
      (+S.tax?'<div><span>Tax ('+(+S.tax)+'%)</span><span>'+money(c.tax)+'</span></div>':'')+
      '<div class="due"><span>Total due</span><span>'+money(c.total)+'</span></div></div>'+
      (S.notes?'<div class="notes pre"><b>Notes</b>'+esc(S.notes)+'</div>':'');
    $("#paper").innerHTML=h;
  }

  function fillFields(){
    $$("[data-k]").forEach(function(el){ el.value=S[el.dataset.k]; });
  }
  function render(){ renderPaper(); save(); }

  document.addEventListener("input",function(e){
    var el=e.target;
    if(el.dataset.k){ S[el.dataset.k]=el.value; render(); }
    else if(el.dataset.f){ S.items[+el.dataset.i][el.dataset.f]=el.value; render(); }
  });
  document.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.del!==undefined){
      S.items.splice(+b.dataset.del,1);
      if(!S.items.length) S.items.push({d:"",q:1,r:0});
      renderItems(); render();
    } else if(b.dataset.net!==undefined){
      S.due=addDays(S.issue||iso(new Date()),+b.dataset.net);
      fillFields(); render(); toast("Due date set");
    }
  });
  $("#add").onclick=function(){
    S.items.push({d:"",q:1,r:0}); renderItems(); render();
    var ins=$$("#items input[data-f=d]"); ins[ins.length-1].focus();
  };
  $("#print").onclick=function(){ window.print(); };
  $("#new").onclick=function(){
    var keep={from:S.from,fromAddr:S.fromAddr,cur:S.cur,notes:S.notes,tax:S.tax};
    var n=blank((S.counter||1)+1);
    for(var k in keep) n[k]=keep[k];
    S=n; fillFields(); renderItems(); render(); toast("New invoice ready: "+S.num);
  };
  $("#theme").onclick=function(){
    var r=document.documentElement;
    var dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme=dark?"light":"dark";
  };

  fillFields(); renderItems(); render();
})();
</script>
</body>
</html>
